name: Build and publish

on:
  push:
    tags: ["v*"]

jobs:
  # A tag is the one build nobody watches, so nothing is published unless this passes.
  # Run in the same golang image the Dockerfiles build with, rather than a setup-go
  # version pin that drifts from them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker run --rm -v "$PWD":/src -w /src golang:alpine sh -c "go vet ./... && go test ./..."

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The backup sidecar, versioned in lockstep with the server it uploads to.
      - uses: docker/metadata-action@v6
        id: meta-agent
        with:
          images: ghcr.io/${{ github.repository }}-agent
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
